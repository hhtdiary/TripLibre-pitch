<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A Travel Diary That Doesn't End</title>
    <meta name="description" content="TripLibre — a researcher builds a travel diary app with AI. Zhanchao Yang, GIS Day 2026." />
    <link rel="icon" type="image/png" href="./assets/triplibre-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@500;600;700;800;900&family=Source+Sans+3:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Space+Grotesk:wght@400;500;700&display=swap"
    />
    <script>
      // Apply the theme before first paint (same rules as src/theme.tsx).
      ;(function () {
        var ok = ['app', 'tech', 'academic', 'minimal', 'notebook']
        var t = new URLSearchParams(location.search).get('theme')
        if (ok.indexOf(t) < 0) { try { t = localStorage.getItem('triplibre-theme') } catch (e) { t = null } }
        document.documentElement.dataset.theme = ok.indexOf(t) < 0 ? 'app' : t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
